<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Author Box Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable author box component for blog posts, tutorials, case studies, and professional learning pages.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section" aria-labelledby="author-box-title">
      <div class="container section__inner">
        <header class="section-heading section-heading--center">
          <p class="section-heading__eyebrow">Author Trust</p>

          <h1 class="section-heading__title" id="author-box-title">
            Author box component
          </h1>

          <p class="section-heading__text">
            A reusable component for showing who created an article, guide, tutorial, or case study.
          </p>
        </header>

        <aside class="author-box" aria-label="About the author">
          <div class="author-box__avatar" aria-hidden="true">
            JV
          </div>

          <div class="author-box__content">
            <p class="author-box__eyebrow">Written by</p>

            <h2 class="author-box__name">
              Jacuba Visuals Web
            </h2>

            <p class="author-box__text">
              Web development, design, and photography focused on fast, accessible, and search-engine-friendly business websites.
            </p>

            <a class="author-box__link" href="#" title="Learn more about Jacuba Visuals Web">
              View profile
            </a>
          </div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
