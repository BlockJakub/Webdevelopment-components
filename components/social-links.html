<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social Links Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable social links component for professional websites, footers, contact pages, and business profile sections.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section section--muted" aria-labelledby="social-links-title">
      <div class="container section__inner">
        <header class="section-heading section-heading--center">
          <p class="section-heading__eyebrow">Business Profiles</p>

          <h1 class="section-heading__title" id="social-links-title">
            Social links component
          </h1>

          <p class="section-heading__text">
            A reusable link group for social profiles, review platforms, and professional business channels.
          </p>
        </header>

        <nav class="social-links" aria-label="Social media links">
          <a class="social-links__link" href="#" title="Visit Facebook profile">
            Facebook
          </a>

          <a class="social-links__link" href="#" title="Visit Instagram profile">
            Instagram
          </a>

          <a class="social-links__link" href="#" title="Visit LinkedIn profile">
            LinkedIn
          </a>

          <a class="social-links__link" href="#" title="Visit Google Business profile">
            Google Business
          </a>
        </nav>
      </div>
    </section>
  </main>
</body>
</html>
