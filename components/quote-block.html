<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quote Block Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable quote block component for testimonials, case studies, articles, and professional website storytelling.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section section--muted" aria-labelledby="quote-block-title">
      <div class="container section__inner">
        <header class="section-heading section-heading--center">
          <p class="section-heading__eyebrow">Content Highlight</p>

          <h1 class="section-heading__title" id="quote-block-title">
            Quote block component
          </h1>

          <p class="section-heading__text">
            A reusable quote pattern for important messages, article highlights, client feedback, and case study storytelling.
          </p>
        </header>

        <figure class="quote-block">
          <blockquote class="quote-block__quote">
            <p>
              A professional website is not just a page on the internet. It is a structured system that helps people understand, trust, and contact a business.
            </p>
          </blockquote>

          <figcaption class="quote-block__caption">
            <strong class="quote-block__author">Jacuba Visuals Web</strong>
            <span class="quote-block__role">Web Development and Design</span>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
