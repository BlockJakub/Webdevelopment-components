<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hero Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable hero section component for professional business websites with semantic HTML, strong calls to action, and clean responsive layout.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="container">
        <div class="hero__inner">
          <div class="hero__content">
            <p class="hero__eyebrow">Professional Web Components</p>

            <h1 class="hero__title" id="hero-title">
              Build faster websites with reusable HTML and CSS components.
            </h1>

            <p class="hero__text">
              A clean component system for business websites, portfolio pages, landing pages, and search-engine-friendly layouts.
            </p>

            <div class="hero__actions">
              <a class="button button--primary" href="cards.html" title="View reusable card components">
                View Components
              </a>

              <a class="button button--outline" href="navigation.html" title="View navigation component">
                See Navigation
              </a>
            </div>
          </div>

          <div class="hero__visual" aria-hidden="true">
            <div class="hero__panel">
              <span class="hero__panel-dot"></span>
              <span class="hero__panel-dot"></span>
              <span class="hero__panel-dot"></span>

              <div class="hero__panel-line hero__panel-line--wide"></div>
              <div class="hero__panel-line"></div>
              <div class="hero__panel-line hero__panel-line--short"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
