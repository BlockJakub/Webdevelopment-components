<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CTA Band Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A compact reusable call-to-action band component for professional business websites and conversion-focused page sections.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section" aria-labelledby="cta-band-title">
      <div class="container">
        <div class="cta-band">
          <div class="cta-band__content">
            <h1 class="cta-band__title" id="cta-band-title">
              Need a reusable website section?
            </h1>

            <p class="cta-band__text">
              Use this compact call-to-action between content sections, service blocks, or portfolio previews.
            </p>
          </div>

          <a class="button button--primary" href="#" title="Start a website project enquiry">
            Start Project
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
