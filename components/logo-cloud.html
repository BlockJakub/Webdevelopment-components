<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logo Cloud Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable logo cloud component for showing technologies, tools, clients, partners, or trusted platforms on professional websites.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section" aria-labelledby="logo-cloud-title">
      <div class="container section__inner">

        <header class="section-heading section-heading--center">
          <p class="section-heading__eyebrow">Trusted Tools</p>

          <h1 class="section-heading__title" id="logo-cloud-title">
            Logo cloud component
          </h1>

          <p class="section-heading__text">
            A reusable section for showing tools, technologies, platforms, partners, or client logos.
          </p>
        </header>

        <ul class="logo-cloud" aria-label="Technologies and tools">
          <li class="logo-cloud__item">HTML5</li>
          <li class="logo-cloud__item">CSS3</li>
          <li class="logo-cloud__item">JavaScript</li>
          <li class="logo-cloud__item">PHP</li>
          <li class="logo-cloud__item">MySQL</li>
          <li class="logo-cloud__item">Google Cloud</li>
        </ul>

      </div>
    </section>
  </main>
</body>
</html>
