<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Call to Action Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable call-to-action section for professional business websites, lead generation pages, and conversion-focused landing pages.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section" aria-labelledby="cta-title">
      <div class="container">

        <div class="cta">
          <div class="cta__content">
            <p class="cta__eyebrow">Ready to build faster?</p>

            <h1 class="cta__title" id="cta-title">
              Create professional websites with reusable components.
            </h1>

            <p class="cta__text">
              Use this call-to-action pattern to guide visitors toward enquiries, bookings, service pages, or project consultations.
            </p>
          </div>

          <div class="cta__actions">
            <a class="button button--primary" href="#" title="Start a website project enquiry">
              Start Project
            </a>

            <a class="button button--outline" href="cards.html" title="View reusable card components">
              View Components
            </a>
          </div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
