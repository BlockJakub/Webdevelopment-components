<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Hero Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable page hero component for internal website pages, including services, portfolio, about, contact, and case study layouts.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">

  <main>
    <section class="page-hero" aria-labelledby="page-hero-title">

        <div class="page-hero__inner">
          <nav class="breadcrumb" aria-label="Breadcrumb">

              <li class="breadcrumb__item">
                <a class="breadcrumb__link" href="../index.html">

          </nav>

          <div class="page-hero__content">
            <p class="page-hero__eyebrow">Professional Website System</p>

              Reusable page hero component
