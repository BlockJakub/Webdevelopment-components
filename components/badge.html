<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Badge Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable badge component for categories, statuses, labels, service tags, and professional website interface states.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section" aria-labelledby="badge-title">
      <div class="container section__inner">
        <header class="section-heading section-heading--center">
          <p class="section-heading__eyebrow">Small Interface Labels</p>

          <h1 class="section-heading__title" id="badge-title">
            Badge component
          </h1>

          <p class="section-heading__text">
            A reusable badge pattern for categories, status labels, featured content, and interface states.
          </p>
        </header>

        <div class="cluster">
          <span class="badge">Default</span>
          <span class="badge badge--primary">Primary</span>
          <span class="badge badge--success">Success</span>
          <span class="badge badge--warning">Warning</span>
          <span class="badge badge--danger">Danger</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
