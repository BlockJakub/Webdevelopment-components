<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stats Component | Reusable HTML and CSS System</title>
  <meta name="description" content="A reusable statistics component for professional business websites, proof sections, results, and performance metrics.">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>

<body>
  <main>
    <section class="section section--muted" aria-labelledby="stats-title">
      <div class="container section__inner">

        <header class="section-heading section-heading--center">
          <p class="section-heading__eyebrow">Business Proof</p>

          <h1 class="section-heading__title" id="stats-title">
            Stats component
          </h1>

          <p class="section-heading__text">
            A reusable proof section for showing business results, project numbers, speed improvements, or service value.
          </p>
        </header>

        <div class="stats">
          <article class="stats__item">
            <strong class="stats__number">95+</strong>
            <p class="stats__label">Performance score target</p>
          </article>

          <article class="stats__item">
            <strong class="stats__number">100%</strong>
            <p class="stats__label">Responsive layout focus</p>
          </article>

          <article class="stats__item">
            <strong class="stats__number">24/7</strong>
            <p class="stats__label">Website visibility</p>
          </article>

          <article class="stats__item">
            <strong class="stats__number">SEO</strong>
            <p class="stats__label">Search-friendly structure</p>
          </article>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
